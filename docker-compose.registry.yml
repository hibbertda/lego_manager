version: "3.8"

# Deployment example: pull the pre-built image from the Gitea container
# registry instead of building locally. Use this on the actual Docker host
# rather than `docker-compose.yml` (which builds from source, for local
# dev/testing).
#
# Usage:
#   docker compose -f docker-compose.registry.yml pull
#   docker compose -f docker-compose.registry.yml up -d
#
# The image is published by .gitea/workflows/build-image.yml on every push
# to main (tag: latest) or via a manual workflow_dispatch run with a custom
# tag. If the registry is private, log in first on the host:
#   docker login gitea.thehibbs.net

services:
  lego-manager:
    image: gitea.thehibbs.net/xamlok/lego_manager:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # See docker-compose.yml for why this points at a mounted *directory*
      # rather than bind-mounting the .db file directly.
      - DATABASE_PATH=/app/data/lego_sets.db
    volumes:
      - ./data:/app/data
      - ./sets:/app/sets
    restart: unless-stopped
