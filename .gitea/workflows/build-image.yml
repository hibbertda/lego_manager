# Build the Lego Manager Docker image on the in-cluster Gitea act-runner
# (apps/act-runner — it has a privileged Docker-in-Docker sidecar) and push
# it to the Gitea container registry.
#
# HOW TO RUN
#   - Automatically: on every push to any branch (see "Image tagging"
#     below for what tag you get).
#   - On demand: Gitea UI -> repo -> Actions -> "Build lego-manager image"
#     -> "Run workflow" (lets you override the tag).
#
# IMAGE TAGGING
#   - Push to main: tagged "latest" (+ short commit SHA).
#   - Push to any other branch: tagged with the branch name itself (+ short
#     SHA) instead of "latest", e.g. pushing react-ui-rewrite publishes
#     ...lego_manager:react-ui-rewrite. This lets you pull/test a feature
#     branch's image (docker-compose.registry.yml or a one-off `docker run`)
#     without touching the "latest" tag your production deploy tracks —
#     only merging to main (or a manual dispatch) moves "latest".
#   - Manual dispatch: tagged whatever you typed in, overriding the above.
#
# After it pushes, restart the deployment so it re-pulls the (mutable) tag:
#   kubectl -n lego-manager rollout restart deploy/lego-manager
# (Or `docker compose pull && docker compose up -d` for a docker-compose host.)

name: Build lego-manager image

on:
  push:
    # No branch filter: every branch gets built and pushed under its own
    # tag (see "IMAGE TAGGING" above) so you can test before merging.
    # Skip the image build entirely for changes that can't affect the
    # image contents (docs/wiki/license/editor config, and the sibling
    # GitHub-only workflow) — avoids a pointless rebuild on every doc tweak.
    # Update this list if new non-code paths are added.
    paths-ignore:
      - "**/*.md"
      - "wiki/**"
      - "LICENSE"
      - ".github/**"
      - ".vscode/**"
      - ".devcontainer/**"
      - ".editorconfig"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to push (leave blank to auto-select per branch)
        required: false

concurrency:
  group: build-lego-manager
  cancel-in-progress: true

env:
  IMAGE: gitea.thehibbs.net/xamlok/lego_manager

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Unlike GitHub's hosted ubuntu-latest runners, the act-runner image
      # behind Gitea's "ubuntu-latest" label doesn't ship Python — install it
      # explicitly (same apt-based approach the build job already uses below
      # for the Docker CLI). Use a venv rather than pip installing into the
      # system Python, since recent Debian/Ubuntu refuse system-wide pip
      # installs (PEP 668 "externally-managed-environment").
      - name: Install Python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv
      - name: Install and validate
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt -r requirements-dev.txt
          ruff check .
          ruff format --check .
          pytest -q
      # The Docker build now has a frontend-builder stage that runs
      # `npm ci && npm run build` (see Dockerfile) — validate that here too,
      # so a broken SPA build/lint fails fast in this job instead of only
      # surfacing later as a failed `docker build .` in the build job below.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      # The act-runner injects --add-host=docker:host-gateway into job
      # containers, so this resolves to the in-pod docker:dind daemon (non-TLS).
      DOCKER_HOST: tcp://docker:2375
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest job containers don't ship a docker CLI; the act-runner
      # exposes the DinD daemon to this job, so we just need the CLI.
      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io
          docker version

      # Auth to the Gitea container registry. Gitea's built-in Actions token
      # (GITHUB_TOKEN) does NOT carry package/registry write scope, so use a
      # Personal Access Token instead:
      #   1. Gitea -> Settings -> Applications -> Generate New Token
      #      with the "write:package" (and "read:package") scopes.
      #   2. Repo -> Settings -> Actions -> Secrets -> add DOCKERBUILD_SECRET = that PAT.
      - name: Log in to Gitea registry
        run: |
          echo "${{ secrets.DOCKERBUILD_SECRET }}" \
            | docker login gitea.thehibbs.net -u "${{ github.repository_owner }}" --password-stdin

      # main -> "latest" (what production tracks); any other branch -> the
      # branch name itself, so a feature branch never overwrites "latest".
      # A manual dispatch tag always wins when provided.
      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG="latest"
          else
            # Sanitize the branch name into a valid Docker tag.
            TAG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            -t "${IMAGE}:${{ steps.tag.outputs.tag }}" \
            -t "${IMAGE}:${GITHUB_SHA::7}" \
            .

      - name: Push image
        run: |
          docker push "${IMAGE}:${{ steps.tag.outputs.tag }}"
          docker push "${IMAGE}:${GITHUB_SHA::7}"

      - name: Logout
        if: always()
        run: docker logout gitea.thehibbs.net
