{% extends "base.html" %}
{% block title %}Initial Setup{% endblock %}
{% block content %}
<div class="d-flex justify-content-center">
    <div class="card shadow-sm" style="max-width: 26rem; width: 100%;">
        <div class="card-body p-4">
            <h1 class="h4 text-center mb-1"><i class="bi bi-box-seam-fill"></i> Welcome to Lego Manager</h1>
            <p class="text-muted text-center mb-4">Create the initial administrator account to get started.</p>
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required minlength="8">
                    <div class="form-text">At least 8 characters.</div>
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="8">
                </div>
                <button type="submit" class="btn btn-primary w-100">Create admin account</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
