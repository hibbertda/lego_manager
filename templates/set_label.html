{% extends "base.html" %}
{% block title %}Label &ndash; {{ set.name }}{% endblock %}
{% block content %}
<nav aria-label="breadcrumb" class="no-print">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('sets.list_sets') }}">My Sets</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('sets.set_detail', set_id=set.setID) }}">{{ set.name }}</a></li>
        <li class="breadcrumb-item active" aria-current="page">Label</li>
    </ol>
</nav>

<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3 no-print">
    <h1 class="h4 mb-0">Storage-box label</h1>
    <div class="d-flex gap-2">
        <button type="button" class="btn btn-primary btn-sm" onclick="window.print()">
            <i class="bi bi-printer-fill"></i> Print
        </button>
        <a href="{{ url_for('sets.set_label_image', set_id=set.setID, download=1) }}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-download"></i> Download PNG
        </a>
    </div>
</div>

<div class="label-print-wrap">
    <img src="{{ url_for('sets.set_label_image', set_id=set.setID) }}" alt="Label for {{ set.name }}" class="label-print-img">
</div>
{% endblock %}

{% block scripts %}
    {{ super() }}
    <style>
        /* The label is authored at 4in x 2in (1200x600px @ 300dpi); scale it
           down for on-screen preview but print it at true physical size. */
        .label-print-wrap {
            max-width: 48rem;
        }
        .label-print-img {
            width: 100%;
            height: auto;
            border: 1px solid #dee2e6;
        }
        @media print {
            .no-print, header, .app-sidebar {
                display: none !important;
            }
            @page {
                size: 4in 2in landscape;
                margin: 0;
            }
            .label-print-wrap {
                max-width: none;
            }
            .label-print-img {
                width: 4in;
                height: 2in;
                border: none;
            }
        }
    </style>
{% endblock %}
