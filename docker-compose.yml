version: "3.8"

services:
  lego-manager:
    # Local dev/testing: build the image from this checkout.
    build: .
    # Production/deployment: pull the pre-built image from the Gitea registry
    # instead (published by .gitea/workflows/build-image.yml). Comment out
    # `build: .` above and uncomment the line below, then `docker compose pull`.
    # image: gitea.thehibbs.net/xamlok/lego_manager:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Store the DB inside the mounted data/ *directory* rather than
      # bind-mounting the .db file directly. If you bind-mount a file path
      # that doesn't already exist on the host, Docker silently creates a
      # directory there instead, which breaks sqlite3.connect() with
      # "unable to open database file" — mounting a directory avoids that
      # entirely, since directories are always created correctly.
      - DATABASE_PATH=/app/data/lego_sets.db
    volumes:
      - ./data:/app/data
      - ./sets:/app/sets
    restart: unless-stopped
