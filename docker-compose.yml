version: "3.8"

services:
  lego-manager:
    # Local dev/testing: build the image from this checkout.
    build: .
    # Production/deployment: pull the pre-built image from the Gitea registry
    # instead (published by .gitea/workflows/build-image.yml). Comment out
    # `build: .` above and uncomment the line below, then `docker compose pull`.
    # image: gitea.thehibbs.net/xamlok/lego_manager:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./lego_sets.db:/app/lego_sets.db
      - ./sets:/app/sets
    restart: unless-stopped
