# Build the Docker image on GitHub Actions, publish it to the GitHub
# Container Registry (ghcr.io), and cut a GitHub Release once it succeeds.
#
# This mirrors what .gitea/workflows/build-image.yml does against the Gitea
# registry, but is entirely independent — it only runs against this repo's
# own GitHub Actions and ghcr.io, and never touches the Gitea instance.
#
# HOW TO RUN
#   - Automatically: on every push to any branch (see "IMAGE TAGGING" below
#     for what you get), and on pull requests (test job only — see below).
#   - On demand: Actions -> "Build and release container" -> "Run workflow"
#     (lets you override the release tag).
#
# IMAGE TAGGING
#   - Push to main: tagged "latest" + an auto-generated version (a GitHub
#     Release is also cut for that version).
#   - Push to any other branch: tagged with the branch name itself instead,
#     e.g. pushing react-ui-rewrite publishes ghcr.io/.../lego_manager
#     :react-ui-rewrite. No release is created and "latest" is untouched —
#     this lets you pull/test a feature branch's image before merging.
#   - Pull requests only run the test job (lint/tests/frontend build) —
#     they never build or push an image, since a PR from the same repo
#     already gets an image from its underlying branch push above.
#   - Manual dispatch: tagged (and released) under whatever you typed in.
#
# VERSIONING
#   No formal semver process exists for this project yet, so releases are
#   auto-tagged v1.0.<run number> (monotonically increasing, always unique)
#   unless a tag is supplied via workflow_dispatch. Bump the "1.0" prefix
#   here manually if/when a breaking change warrants a new major/minor line.
#
# PACKAGE VISIBILITY
#   New GHCR packages default to private even in a public repo. After the
#   first run, make it public once: github.com/users/hibbertda/packages ->
#   lego_manager -> Package settings -> Change visibility.

name: Build and release container

on:
  pull_request:
  push:
    # No branch filter: every branch gets built and pushed under its own
    # tag (see "IMAGE TAGGING" above) so you can test before merging.
    # Skip the build+release entirely for changes that can't affect the
    # image contents (docs/wiki/license/editor config, and the sibling
    # Gitea-only workflow) — avoids a pointless rebuild+release on every
    # doc tweak. Update this list if new non-code paths are added.
    paths-ignore:
      - "**/*.md"
      - "wiki/**"
      - "LICENSE"
      - ".gitea/**"
      - ".vscode/**"
      - ".devcontainer/**"
      - ".editorconfig"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to use (e.g. v1.2.3). Leave blank to auto-select per branch.
        required: false

concurrency:
  group: build-release-lego-manager
  cancel-in-progress: false

permissions:
  contents: write   # to create the GitHub Release
  packages: write    # to push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest -q
      # The Docker build has a frontend-builder stage that runs
      # `npm ci && npm run build` (see Dockerfile) — validate that here too,
      # so a broken SPA build/lint fails fast instead of only surfacing as a
      # failed `docker build` in the build-and-release job below.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  build-and-release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image tags
        id: version
        run: |
          # main (or a manual dispatch) -> "latest" + a version tag, and a
          # GitHub Release is cut for that version. Any other branch -> the
          # branch name itself only, no "latest", no release — just an
          # image you can pull and test before merging.
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            TAGS="${IMAGE}:latest"$'\n'"${IMAGE}:${TAG}"
            RELEASE=true
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG="v1.0.${{ github.run_number }}"
            TAGS="${IMAGE}:latest"$'\n'"${IMAGE}:${TAG}"
            RELEASE=true
          else
            # Sanitize the branch name into a valid Docker tag.
            SLUG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g')
            TAG=""
            TAGS="${IMAGE}:${SLUG}"
            RELEASE=false
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: ${{ steps.version.outputs.release_tag }}
          generate_release_notes: true
          body: |
            Container image: `${{ env.IMAGE }}:${{ steps.version.outputs.release_tag }}`

            ```bash
            docker pull ${{ env.IMAGE }}:${{ steps.version.outputs.release_tag }}
            ```
