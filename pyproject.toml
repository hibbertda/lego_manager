[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
extend-exclude = ["static"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E501"]

[tool.mypy]
files = ["app", "cli.py"]
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["attr-defined"]
